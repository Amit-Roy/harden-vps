name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck nftables jq
      - name: Test
        run: bash test/run.sh
