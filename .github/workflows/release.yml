name: release
# Pushing a tag like v0.1.1 stages a release on npm through trusted publishing (OIDC, no stored token).
# A staged release goes live only after the owner approves it on npmjs.com with 2FA, so a compromised
# workflow alone cannot publish. Trusted publisher: owner Amit-Roy, repository harden-vps, workflow release.yml.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Tests
        run: bash test/run.sh
      - name: npm with staged publishing
        run: npm install -g npm@11.19.0
      - name: Stage for approval
        run: npm stage publish . --provenance --access public
