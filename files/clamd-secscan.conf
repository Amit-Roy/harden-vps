LocalSocket /run/secscan-clamd.sock
User root
Foreground yes
DatabaseDirectory /var/lib/clamav
MaxThreads 6
MaxFileSize 25M
MaxScanSize 100M
ExcludePath /node_modules/
ExcludePath /\.git/
ExcludePath /\.venv/
ExcludePath /\.cache/
ExcludePath /\.npm/
ExcludePath /\.bun/install/cache/
ExcludePath /\.local/share/uv/
@CLAM_EXTRA_EXCLUDES@
